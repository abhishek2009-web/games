<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake Game</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    canvas { background:#000; display:block; margin:20px auto; }
  </style>
</head>
<body>
  <h2>Snake Game</h2>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <script>
    const canvas=document.getElementById("gameCanvas");
    const ctx=canvas.getContext("2d");
    let box=20,snake=[{x:9*box,y:10*box}],direction="RIGHT";
    let food={x:Math.floor(Math.random()*19+1)*box,y:Math.floor(Math.random()*19+1)*box};
    document.addEventListener("keydown",dir);
    function dir(e){ if(e.key==="ArrowLeft"&&direction!=="RIGHT")direction="LEFT";
      else if(e.key==="ArrowUp"&&direction!=="DOWN")direction="UP";
      else if(e.key==="ArrowRight"&&direction!=="LEFT")direction="RIGHT";
      else if(e.key==="ArrowDown"&&direction!=="UP")direction="DOWN"; }
    function draw(){
      ctx.clearRect(0,0,400,400);
      for(let i=0;i<snake.length;i++){
        ctx.fillStyle=i===0?"green":"white";
        ctx.fillRect(snake[i].x,snake[i].y,box,box);
      }
      ctx.fillStyle="red"; ctx.fillRect(food.x,food.y,box,box);
      let snakeX=snake[0].x,snakeY=snake[0].y;
      if(direction==="LEFT")snakeX-=box;
      if(direction==="UP")snakeY-=box;
      if(direction==="RIGHT")snakeX+=box;
      if(direction==="DOWN")snakeY+=box;
      if(snakeX===food.x&&snakeY===food.y){
        food={x:Math.floor(Math.random()*19+1)*box,y:Math.floor(Math.random()*19+1)*box};
      } else snake.pop();
      let newHead={x:snakeX,y:snakeY};
      snake.unshift(newHead);
    }
    setInterval(draw,100);
  </script>
</body>
</html>
