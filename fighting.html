<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shadow Fight - Magical Battle</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: linear-gradient(to right, #000, #222);
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
  }

  /* Arena */
  .arena {
    position: relative;
    width: 100%;
    height: 100%;
    background: #111;
    overflow: hidden;
  }

  /* Fighters */
  .fighter {
    position: absolute;
    bottom: 0;
    width: 80px;
    height: 200px;
    background-color: rgba(0,0,0,0.8);
    border-radius: 10px;
    box-shadow: inset 0 0 10px #000, 0 0 20px #000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    cursor: pointer;
  }

  /* Shadow fighters with simple animations */
  #fighter1 {
    left: 20%;
    background-color: #222;
    animation: moveLeftRight 2s infinite alternate;
  }

  #fighter2 {
    right: 20%;
    background-color: #444;
    animation: moveRightLeft 2s infinite alternate;
  }

  @keyframes moveLeftRight {
    0% { transform: translateX(0); }
    100% { transform: translateX(20px); }
  }

  @keyframes moveRightLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-20px); }
  }

  /* Magical effect (particles) */
  .magic {
    position: absolute;
    width: 20px;
    height: 20px;
    background: radial-gradient(circle, #00ffff, transparent);
    border-radius: 50%;
    opacity: 0.8;
    animation: floatUp 2s linear forwards;
  }

  @keyframes floatUp {
    from { transform: translateY(0) scale(1); opacity: 0.8; }
    to { transform: translateY(-300px) scale(0.5); opacity: 0; }
  }

  /* Button to trigger magic */
  .attack-btn {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 30px;
    background-color: #00ffff;
    color: #000;
    border: none;
    border-radius: 10px;
    font-size: 1.2em;
    cursor: pointer;
    box-shadow: 0 0 10px #00ffff, inset 0 0 10px #00ffff;
    transition: background 0.3s;
  }

  .attack-btn:hover {
    background-color: #00cccc;
  }

</style>
</head>
<body>

<div class="arena">
  <!-- Fighters -->
  <div id="fighter1" class="fighter"></div>
  <div id="fighter2" class="fighter"></div>

  <!-- Magic particles container -->
  <div id="magic-container"></div>

  <!-- Attack Button -->
  <button class="attack-btn" onclick="castMagic()">Cast Magical Attack!</button>
</div>

<script>
  const magicContainer = document.getElementById('magic-container');

  function castMagic() {
    // Create multiple magic particles
    for (let i=0; i<20; i++) {
      const magic = document.createElement('div');
      magic.className = 'magic';

      // Random start position near fighters
      magic.style.left = Math.random() > 0.5 ? '25%' : '75%';
      magic.style.bottom = '0';

      // Random animation delay
      magic.style.animationDelay = `${Math.random() * 0.5}s`;

      // Append to container
      magicContainer.appendChild(magic);

      // Remove after animation completes
      magic.addEventListener('animationend', () => {
        magic.remove();
      });
    }
  }
</script>

</body>
</html>
